<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ships - BF-C Internal Market</title>
<style>
    body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #9C8AE0, #6A53C3);
        min-height: 150vh;
    }

    .logo {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.08;
        max-width: 50%;
        z-index: 0;
        pointer-events: none;
    }

    .title {
        font-size: 32px;
        font-weight: bold;
        color: #3A2F6B;
        margin-bottom: 10px;
    }

    .spacer {
        margin-top: 40px;
    }

    /* 2 per row, centered grid */
    .box-container {
        display: grid;
        grid-template-columns: repeat(2, 200px);
        gap: 25px;
        justify-content: center; /* center the grid */
        margin-top: 40px;
        position: relative;
        z-index: 1;
    }

    .box {
        width: 200px;
        height: 200px;
        border: 2px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;

        opacity: 0;
        transform: translateY(40px) scaleY(1);
        transition:
            opacity 0.6s ease,
            transform 0.6s ease,
            width 0.3s ease;
    }

    .box.visible {
        opacity: 1;
        transform: translateY(0) scaleY(1);
    }

    .box:hover {
        width: 216px; /* slightly wider on hover */
        transform: scaleY(1.08); /* small vertical expansion */
        animation: pulseGlow 1.5s infinite alternate;
        cursor: pointer;
    }

    @keyframes pulseGlow {
        0% {
            box-shadow:
                0 0 6px #6A1B9A,
                0 0 12px #8E24AA,
                0 0 24px #9C27B0;
        }
        50% {
            box-shadow:
                0 0 10px #6A1B9A,
                0 0 18px #8E24AA,
                0 0 30px #9C27B0;
        }
        100% {
            box-shadow:
                0 0 8px #6A1B9A,
                0 0 16px #8E24AA,
                0 0 24px #9C27B0;
        }
    }

    .box span {
        position: absolute;
        z-index: 2;
        font-size: 16px;
        color: #fff;
        text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .box img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: auto;
        height: 148%;
        max-width: none;
        transition: all 0.3s ease;
        z-index: 1;
        pointer-events: none;
    }

    /* Last box centered below the two rows */
    .box-container .box:last-child {
        grid-column: 1 / -1;
        justify-self: center;
    }

    @media (max-width: 560px) {
        .box { width: 90vw; height: 90vw; }
        .box:hover { width: 90vw; transform: scaleY(1.03); }
    }
</style>
</head>
<body>

<img class="logo" src="images/logo.png" alt="Logo">

<div class="title">Ships</div>

<div class="spacer"></div>

<div class="box-container">
    <div class="box">
        <span>Fighters</span>
        <img src="images/fighter.jpg" alt="Fighters">
    </div>
    <div class="box">
        <span>Interceptors</span>
        <img src="images/interceptor.jpg" alt="Interceptors">
    </div>
    <div class="box">
        <span>Haulers</span>
        <img src="images/hauler.jpg" alt="Haulers">
    </div>
    <div class="box">
        <span>Miners</span>
        <img src="images/miner.jpg" alt="Miners">
    </div>
    <div class="box">
        <span>Corvettes</span>
        <img src="images/corvette.jpg" alt="Corvettes">
    </div>
    <div class="box">
        <span>Frigates</span>
        <img src="images/frigate.jpg" alt="Frigates">
    </div>
    <div class="box">
        <span>Destroyers</span>
        <img src="images/destroyer.jpg" alt="Destroyers">
    </div>
</div>

<script>
const boxes = document.querySelectorAll('.box');
const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
        else entry.target.classList.remove('visible');
    });
}, { threshold: 0.2 });

boxes.forEach(box => observer.observe(box));

window.addEventListener('scroll', () => {
    const logo = document.querySelector('.logo');
    if (!logo) return;
    const y = window.scrollY * 0.15;
    logo.style.transform = `translate(-50%, calc(-50% + ${y}px))`;
});
</script>

</body>
</html>
