<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BF-C Internal Market</title>
<style>
    /* Background gradient */
    body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #B9A6F2, #7F66D2);
        min-height: 150vh; /* make page scrollable to see effect */
    }

    /* Logo fixed behind boxes */
    .logo {
        position: fixed; /* stays with viewport while scrolling */
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.08;
        max-width: 50%;
        z-index: 0;
        pointer-events: none;
    }

    /* Titles */
    .title {
        font-size: 32px;
        font-weight: bold;
        color: #3A2F6B;
    }

    .subtitle {
        font-size: 16px;
        margin-top: 5px;
        color: #fff;
    }

    .spacer {
        margin-top: 40px;
    }

    .box-container {
        display: flex;
        flex-direction: column;
        gap: 25px;
        align-items: center;
        margin-top: 40px;
        position: relative;
        z-index: 1;
    }

    .box {
        width: 350px;
        height: 200px;
        border: 2px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
        overflow: hidden;
        transition: width 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .box:hover {
        width: 525px;
        transform: scaleY(1.1);
        box-shadow: 0 8px 25px rgba(127, 102, 210, 0.7), 0 0 20px rgba(127, 102, 210, 0.5);
    }

    .box span {
        position: absolute;
        z-index: 2;
        font-size: 20px;
        color: #fff;
        text-shadow: 0 1px 4px rgba(0,0,0,0.8);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
    }

    .box img {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: auto;
        height: 148%;
        max-width: none;
        transition: all 0.3s ease;
    }
</style>
</head>
<body>

<!-- Logo -->
<img class="logo" src="images/logo.png" alt="Logo">

<div class="title">BF-C Internal Market</div>
<div class="subtitle">Hosted by NebulaWhisperer</div>

<div class="spacer"></div>

<div class="box-container">
    <div class="box">
        <span>Ships</span>
        <img src="images/ships.jpg" alt="Ships">
    </div>
    <div class="box">
        <span>Turrets</span>
        <img src="images/turrets.jpg" alt="Turrets">
    </div>
    <div class="box">
        <span>Modules</span>
        <img src="images/modules.jpg" alt="Modules">
    </div>
    <div class="box">
        <span>Materials</span>
        <img src="images/materials.jpg" alt="Materials">
    </div>
    <div class="box">
        <span>Miscellaneous</span>
        <img src="images/misc.jpg" alt="Miscellaneous">
    </div>
</div>

</body>
</html>
