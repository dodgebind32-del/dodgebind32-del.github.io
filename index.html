<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BF-C Internal Market</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* Title and subtitle */
    h1 {
        margin-top: 50px;
        font-size: 48px;
        text-align: center;
    }

    h2 {
        font-size: 20px;
        text-align: center;
        margin-top: 10px;
    }

    /* Spacer */
    .spacer {
        height: 50px;
    }

    /* Container for boxes */
    .box-container {
        display: flex;
        flex-direction: column; /* vertical layout */
        gap: 20px;
        align-items: center;
        margin-bottom: 50px;
    }

    /* Boxes */
    .box {
        background-color: #e0e0e0; /* neutral light gray */
        color: #333;
        width: 220px;
        height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        border-radius: 12px;
        transition: all 0.5s ease;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    /* Hover effect */
    .box:hover {
        transform: scale(1.8); /* large expansion */
        box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
</style>
</head>
<body>

<h1>BF-C Internal Market</h1>
<h2>Hosted by NebulaWhisperer</h2>

<div class="spacer"></div>

<div class="box-container">
    <div class="box">Ships</div>
    <div class="box">Turrets</div>
    <div class="box">Modules</div>
    <div class="box">Materials</div>
    <div class="box">Miscellaneous</div>
</div>

</body>
</html>
