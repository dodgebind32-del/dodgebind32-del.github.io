<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BF-C Internal Market</title>

<style>
    body {
        margin: 0;
        padding: 40px;
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(180deg, #3a1f5d 0%, #1e1133 100%);
        min-height: 200vh;
        position: relative;
        overflow-x: hidden;
    }

    /* Centered parallax logo */
    .logo-bg {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 550px;
        height: 550px;
        transform: translate(-50%, -50%);
        opacity: 0.18;
        z-index: -1;
        pointer-events: none;
        background-repeat: no-repeat;
        background-size: contain;
        background-position: center;
    }

    .title {
        font-size: 32px;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 10px #a56eff;
    }

    .subtitle {
        font-size: 16px;
        margin-top: 5px;
        color: #d8c5ff;
    }

    .spacer {
        margin-top: 40px;
    }

    .box-container {
        display: flex;
        flex-direction: column;
        gap: 25px;
        align-items: center;
        margin-top: 40px;
    }

    /* Base box settings */
    .box {
        width: 350px;
        height: 160px;
        padding: 30px;
        border: 2px solid #ddd;
        border-radius: 8px;
        background-color: #f9f9f9;
        overflow: hidden;
        position: relative;

        /* fade in/out */
        opacity: 0;
        transform: translateY(40px);
        transition:
            opacity 0.6s ease,
            transform 0.6s ease,
            width 0.3s ease,
            box-shadow 0.3s ease;
    }

    /* fade visible */
    .box.visible {
        opacity: 1;
        transform: translateY(0);
    }

    /* Hover expansion */
    .box:hover {
        width: 525px;
        transform: scaleY(1.1);
        box-shadow: 0 0 14px 6px rgba(155, 90, 255, 0.7), 
                    0 0 30px 15px rgba(80, 0, 160, 0.45);
    }

    /* Text inside box */
    .box span {
        position: relative;
        z-index: 2;
        font-size: 20px;
        color: black;
        text-shadow: 0 0 8px rgba(240, 210, 255, 0.8);
    }

    /* Image behavior */
    .box img {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 148%;
        height: auto;
        transform: translate(-50%, -50%);
        z-index: 1;
        pointer-events: none;
        object-fit: cover;
    }
</style>
</head>
<body>

<!-- LOGO BACKGROUND — name your file: logo.png -->
<div class="logo-bg" style="background-image: url('logo.png');"></div>

<div class="title">BF-C Internal Market</div>
<div class="subtitle">Hosted by NebulaWhisperer</div>

<div class="spacer"></div>

<div class="box-container">

    <div class="box">
        <span>Ships</span>
        <img src="ship.png">
    </div>

    <div class="box">
        <span>Turrets</span>
        <img src="turret.png">
    </div>

    <div class="box">
        <span>Modules</span>
        <img src="modules.png">
    </div>

    <div class="box">
        <span>Materials</span>
        <img src="materials.png">
    </div>

    <div class="box">
        <span>Miscellaneous</span>
        <img src="misc.png">
    </div>

</div>

<!-- Fade-in observer -->
<script>
const boxes = document.querySelectorAll('.box');

const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
        } else {
            entry.target.classList.remove('visible');
        }
    });
}, { threshold: 0.2 });

boxes.forEach(box => observer.observe(box));

// Parallax movement for logo
window.addEventListener('scroll', () => {
    const logo = document.querySelector('.logo-bg');
    const y = window.scrollY * 0.15;
    logo.style.transform = `translate(-50%, calc(-50% + ${y}px))`;
});
</script>

</body>
</html>
